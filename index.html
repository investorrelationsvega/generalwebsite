<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vega Website Drafts</title>
  <style>
    :root {
      --black-hole: #000000;
      --night-sky: #27474D;
      --neptune: #6A8F78;
      --moon-dust: #FDF6E5;
      --glacier-white: #FFFFFF;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #0a0f0f;
      color: var(--moon-dust);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      text-align: center;
      padding: 48px 24px;
      max-width: 720px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background-color: var(--neptune);
      margin: 24px auto;
    }

    p {
      font-size: 1rem;
      color: rgba(253, 246, 229, 0.6);
      line-height: 1.7;
      margin-bottom: 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      display: block;
      padding: 48px 32px;
      border: 1px solid rgba(253, 246, 229, 0.1);
      border-radius: 4px;
      text-decoration: none;
      color: var(--moon-dust);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--neptune);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .card:hover::before { transform: scaleX(1); }

    .card--light {
      background: var(--moon-dust);
      color: var(--night-sky);
      border-color: rgba(0,0,0,0.08);
    }

    .card--light:hover {
      box-shadow: 0 12px 40px rgba(253, 246, 229, 0.15);
      transform: translateY(-4px);
    }

    .card--dark {
      background: #162023;
    }

    .card--dark:hover {
      border-color: rgba(106, 143, 120, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(-4px);
    }

    .card__swatch {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 24px;
    }

    .card--light .card__swatch {
      background: linear-gradient(135deg, var(--glacier-white), var(--moon-dust));
      border: 1px solid rgba(0,0,0,0.1);
    }

    .card--dark .card__swatch {
      background: linear-gradient(135deg, #0a0f0f, var(--night-sky));
      border: 1px solid rgba(106,143,120,0.25);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .card span {
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .card .arrow {
      display: block;
      margin-top: 24px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--neptune);
    }

    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Vega</h1>
    <div class="divider"></div>
    <p>Select a theme direction to preview the full website draft.</p>
    <div class="cards">
      <a href="draft-light.html" class="card card--light">
        <div class="card__swatch"></div>
        <h2>Light Theme</h2>
        <span>Moon Dust &amp; Glacier White base</span>
        <span class="arrow">Preview &rarr;</span>
      </a>
      <a href="draft-dark.html" class="card card--dark">
        <div class="card__swatch"></div>
        <h2>Dark Theme</h2>
        <span>Night Sky &amp; Black Hole base</span>
        <span class="arrow">Preview &rarr;</span>
      </a>
    </div>
  </div>
</body>
</html>
